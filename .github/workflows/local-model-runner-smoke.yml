name: Local Model Runner Smoke

on:
  push:
    branches:
      - fix/local-oauth-agent-runner

permissions: {}

jobs:
  smoke:
    runs-on: [self-hosted, macOS, ARM64, quickducks-model]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out trusted smoke branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install locked OpenCode plugin
        run: npm ci --prefix .opencode/ensemble-package --ignore-scripts

      - name: Run OpenChamber through local Codex OAuth
        shell: bash
        run: |
          set -euo pipefail
          openchamber session create \
            --dir "$GITHUB_WORKSPACE" \
            --title "QuickDucks self-hosted runner smoke" \
            --prompt "Read the first heading in AGENTS.md and end your response with LOCAL_RUNNER_OK on its own line. Do not edit files or call shell tools." \
            --model openai/gpt-5.6-sol \
            --agent pipeline-risk-reviewer \
            --variant xhigh \
            --wait \
            --last-assistant \
            --timeout 600 \
            --json \
            > "$RUNNER_TEMP/local-model-smoke.json"
          node <<'NODE'
          const fs = require("node:fs");
          const result = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/local-model-smoke.json`, "utf8"));
          const finalLine = result.lastAssistantMessage?.text?.trim().split(/\r?\n/).at(-1);
          if (result.status !== "ok" || finalLine !== "LOCAL_RUNNER_OK") {
            throw new Error("The local OpenChamber model runner did not return the expected marker.");
          }
          NODE
