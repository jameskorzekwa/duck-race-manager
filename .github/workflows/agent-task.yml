name: Agent Task

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to process or retry
        required: true
        type: number

permissions: {}

concurrency:
  group: quickducks-agent-issue-${{ github.event.issue.number || inputs.issue || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      (github.event_name == 'issues' && github.actor_id == '38769771' && github.event.issue.user.id == 38769771 && contains(github.event.issue.labels.*.name, 'agent:inbox')) ||
      (github.event_name == 'issue_comment' && github.actor_id == '38769771' && github.event.issue.user.id == 38769771 && github.event.comment.user.id == 38769771 && !github.event.issue.pull_request && (startsWith(github.event.comment.body, '/agent') || startsWith(github.event.comment.body, '/oc'))) ||
      (github.event_name == 'workflow_dispatch' && github.actor_id == '38769771') ||
      (github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    env:
      PIPELINE_ISSUE: ${{ github.event.issue.number || inputs.issue }}
    outputs:
      base: ${{ steps.prepare.outputs.base }}
      issue: ${{ steps.prepare.outputs.issue }}
      skip: ${{ steps.prepare.outputs.skip }}
    steps:
      - name: Validate and mark durable run
        id: prepare
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE_NUMBER: ${{ env.PIPELINE_ISSUE }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const trustedUserId = 38769771;
            const stateLabels = [
              "agent:inbox", "agent:triage", "agent:ready", "agent:running",
              "agent:grouped", "agent:blocked", "agent:review", "agent:approved",
              "agent:deployed", "agent:failed",
            ];
            const closingIssues = (body) => [...String(body ?? "").matchAll(
              /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gi,
            )].map((match) => Number(match[1]));
            const setState = async (issue, state) => {
              const labels = (issue.labels ?? []).map((label) => typeof label === "string" ? label : label.name);
              await github.rest.issues.setLabels({
                owner, repo, issue_number: issue.number,
                labels: [...labels.filter((label) => !stateLabels.includes(label)), state],
              });
            };

            const issue = (await github.rest.issues.get({ owner, repo, issue_number: issueNumber })).data;
            if (issue.pull_request || issue.user.id !== trustedUserId || issue.state !== "open") {
              throw new Error(`Issue #${issueNumber} is not an open trusted intake issue.`);
            }
            const branch = await github.rest.repos.getBranch({
              owner, repo, branch: context.payload.repository.default_branch,
            });
            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: "open", per_page: 100,
            });
            const validPipelinePull = (pr) => {
              const branchName = pr.head.ref.match(/^opencode\/issue(\d+)-run(\d+)$/);
              const marker = (pr.body ?? "").match(/<!-- agent-pipeline task-run=(\d+) issue=(\d+) base=([0-9a-f]{40}) -->/);
              const linked = closingIssues(pr.body);
              return pr.user.id === 219766164 && pr.base.ref === context.payload.repository.default_branch
                && pr.head.repo?.id === pr.base.repo?.id && branchName && marker
                && linked.length === 1 && linked[0] === issueNumber
                && marker[1] === branchName[2] && marker[2] === branchName[1]
                && marker[3] === pr.base.sha;
            };
            if (openPulls.some(validPipelinePull)) {
              await setState(issue, "agent:review");
              core.setOutput("base", branch.data.commit.sha);
              core.setOutput("issue", String(issueNumber));
              core.setOutput("skip", "true");
              return;
            }

            await setState(issue, "agent:running");
            await github.rest.issues.createComment({
              owner, repo, issue_number: issueNumber,
              body: `<!-- agent-pipeline task-run=${context.runId} --> Agent Task run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            });
            core.setOutput("base", branch.data.commit.sha);
            core.setOutput("issue", String(issueNumber));
            core.setOutput("skip", "false");

  implement:
    needs: prepare
    if: needs.prepare.result == 'success' && needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      issues: read
      models: read
      pull-requests: read
    env:
      EXPECTED_BASE: ${{ needs.prepare.outputs.base }}
      OPENCODE_ENSEMBLE_TIMEOUT: "2700000"
      PIPELINE_ISSUE: ${{ needs.prepare.outputs.issue }}
    outputs:
      decision: ${{ steps.result.outputs.decision }}
      digest: ${{ steps.result.outputs.digest }}
    steps:
      - name: Check out exact trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.base }}

      - name: Verify trusted base SHA
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install locked agent dependencies
        run: |
          npm ci
          npm ci --prefix .opencode/ensemble-package --ignore-scripts

      - name: Build immutable trusted context
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXPECTED_BASE: ${{ env.EXPECTED_BASE }}
          ISSUE_NUMBER: ${{ env.PIPELINE_ISSUE }}
        with:
          script: |
            const fs = require("node:fs");
            const { owner, repo } = context.repo;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const trustedIds = new Set([38769771, 219766164, 41898282]);
            const closingIssues = (body) => [...String(body ?? "").matchAll(
              /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gi,
            )].map((match) => Number(match[1]));
            const issue = (await github.rest.issues.get({ owner, repo, issue_number: issueNumber })).data;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: issueNumber, per_page: 100,
            });
            const openIssues = (await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", per_page: 100,
            })).filter((item) => !item.pull_request && item.user.id === 38769771
              && item.labels.some((label) => label.name?.startsWith("agent:")));
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: "all", sort: "created", direction: "desc", per_page: 100,
            });
            const relatedPulls = [];
            const validRelatedPull = (pr) => {
              const branch = pr.head.ref.match(/^opencode\/issue(\d+)-run(\d+)$/);
              const marker = (pr.body ?? "").match(/<!-- agent-pipeline task-run=(\d+) issue=(\d+) base=([0-9a-f]{40}) -->/);
              return pr.user.id === 219766164 && pr.head.repo?.id === pr.base.repo?.id
                && branch && marker && branch[1] === String(issueNumber)
                && marker[1] === branch[2] && marker[2] === branch[1]
                && closingIssues(pr.body).length === 1;
            };
            for (const pr of pulls.filter(validRelatedPull).slice(0, 5)) {
              const prComments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pr.number, per_page: 100,
              });
              relatedPulls.push({
                number: pr.number,
                state: pr.state,
                mergedAt: pr.merged_at,
                headSha: pr.head.sha,
                labels: pr.labels.map((label) => label.name),
                comments: prComments.filter((comment) => trustedIds.has(comment.user.id))
                  .map(({ user, body, created_at }) => ({ author: user.login, body, createdAt: created_at })),
              });
            }
            fs.writeFileSync("/tmp/quickducks-task-context.json", JSON.stringify({
              repository: `${owner}/${repo}`,
              baseSha: process.env.EXPECTED_BASE,
              issue: {
                number: issue.number,
                title: issue.title,
                body: issue.body,
                labels: issue.labels.map((label) => label.name),
                comments: comments.filter((comment) => trustedIds.has(comment.user.id))
                  .map(({ user, body, created_at }) => ({ author: user.login, body, createdAt: created_at })),
              },
              activeWork: openIssues.map((item) => ({
                number: item.number,
                title: item.title,
                body: item.body,
                labels: item.labels.map((label) => label.name),
              })),
              relatedPulls,
            }, null, 2));

      - name: Install pinned OpenCode
        run: npm install --global opencode-ai@1.18.8

      - name: Run unprivileged implementation orchestrator
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NO_COLOR: "1"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/agent-task"
          set +e
          opencode run \
            --agent pipeline-orchestrator \
            --format json \
            --model github-models/openai/gpt-4.1 \
            --share=false \
            "Process issue #${PIPELINE_ISSUE} from the immutable trusted snapshot. Follow the pipeline-orchestrator contract and emit exactly one final task marker." \
            > "$RUNNER_TEMP/agent-task/task.jsonl"
          status=$?
          set -e
          printf '%s\n' "$status" > "$RUNNER_TEMP/agent-task/task-exit-status.txt"

      - name: Build deterministic task artifact
        id: result
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --binary --full-index > "$RUNNER_TEMP/agent-task/task.patch"
          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");

          const issue = Number(process.env.PIPELINE_ISSUE);
          const artifactDir = `${process.env.RUNNER_TEMP}/agent-task`;
          const exitStatus = Number(fs.readFileSync(`${artifactDir}/task-exit-status.txt`, "utf8").trim());
          const texts = fs.readFileSync(`${artifactDir}/task.jsonl`, "utf8")
            .split(/\r?\n/)
            .filter(Boolean)
            .flatMap((line) => {
              try {
                const event = JSON.parse(line);
                return event.type === "text" && typeof event.part?.text === "string" ? [event.part.text] : [];
              } catch {
                return [];
              }
            });
          const report = texts.at(-1)?.trim() ?? "Implementation produced no final report.";
          const marker = report.split(/\r?\n/).at(-1)?.trim() ?? "";
          const patch = fs.readFileSync(`${artifactDir}/task.patch`);
          let decision = { type: "failed", numbers: [] };
          let match;
          if ((match = marker.match(/^PIPELINE_TASK_READY:(\d+)$/)) && Number(match[1]) === issue && patch.length > 0) {
            decision = { type: "ready", numbers: [issue] };
          } else if ((match = marker.match(/^PIPELINE_TASK_GROUPED:(\d+)$/)) && Number(match[1]) !== issue && patch.length === 0) {
            decision = { type: "grouped", numbers: [Number(match[1])] };
          } else if ((match = marker.match(/^PIPELINE_TASK_BLOCKED:(\d+(?:,\d+)*)$/)) && patch.length === 0) {
            const numbers = match[1].split(",").map(Number);
            if (!numbers.includes(issue) && new Set(numbers).size === numbers.length) {
              decision = { type: "blocked", numbers };
            }
          } else if ((match = marker.match(/^PIPELINE_TASK_DUPLICATE:(\d+)$/)) && Number(match[1]) !== issue && patch.length === 0) {
            decision = { type: "duplicate", numbers: [Number(match[1])] };
          }
          if (exitStatus !== 0) decision = { type: "failed", numbers: [] };
          const digest = crypto.createHash("sha256").update(patch).digest("hex");
          fs.writeFileSync(`${artifactDir}/task-result.json`, JSON.stringify({
            issue,
            baseSha: process.env.EXPECTED_BASE,
            decision,
            digest,
            report,
            exitStatus,
          }, null, 2));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `decision=${decision.type}\ndigest=${digest}\n`);
          NODE

      - name: Upload immutable task artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-task-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/agent-task/task.patch
            ${{ runner.temp }}/agent-task/task-result.json
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: [prepare, implement]
    if: needs.implement.result == 'success' && needs.implement.outputs.decision == 'ready'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CI: "true"
      EXPECTED_BASE: ${{ needs.prepare.outputs.base }}
      EXPECTED_DIGEST: ${{ needs.implement.outputs.digest }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check out exact trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.base }}

      - name: Download task artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent-task-${{ github.run_id }}-${{ github.run_attempt }}
          path: task-artifact

      - name: Verify and apply exact patch
        run: |
          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const patch = fs.readFileSync("task-artifact/task.patch");
          const result = JSON.parse(fs.readFileSync("task-artifact/task-result.json", "utf8"));
          const digest = crypto.createHash("sha256").update(patch).digest("hex");
          if (result.baseSha !== process.env.EXPECTED_BASE || result.digest !== digest || digest !== process.env.EXPECTED_DIGEST) {
            throw new Error("Task artifact identity does not match the trusted implementation output.");
          }
          if (result.decision?.type !== "ready") throw new Error("Task artifact is not ready for verification.");
          NODE
          git apply --index --check task-artifact/task.patch
          git apply --index task-artifact/task.patch
          test -n "$(git diff --cached --name-only)"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install locked dependencies
        run: |
          npm ci
          npm ci --prefix .opencode/ensemble-package --ignore-scripts

      - name: Run deterministic release gate
        run: |
          npm audit --audit-level=high
          npm audit --prefix .opencode/ensemble-package --audit-level=high
          npm run typecheck
          npm test
          npx playwright install --with-deps chromium
          npm run test:e2e
          npm run wrangler:validate
          npm run db:migrate:local

  publish:
    needs: [prepare, implement, verify]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    env:
      EXPECTED_BASE: ${{ needs.prepare.outputs.base }}
      ISSUE_NUMBER: ${{ needs.prepare.outputs.issue }}
    steps:
      - name: Check out exact trusted base
        if: needs.implement.result == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.base }}

      - name: Download task artifact
        if: needs.implement.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent-task-${{ github.run_id }}-${{ github.run_attempt }}
          path: task-artifact

      - name: Record non-code decision
        if: needs.implement.result == 'success' && needs.implement.outputs.decision != 'ready'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
        with:
          script: |
            const fs = require("node:fs");
            const { owner, repo } = context.repo;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const result = JSON.parse(fs.readFileSync("task-artifact/task-result.json", "utf8"));
            const states = [
              "agent:inbox", "agent:triage", "agent:ready", "agent:running",
              "agent:grouped", "agent:blocked", "agent:review", "agent:approved",
              "agent:deployed", "agent:failed",
            ];
            const issue = (await github.rest.issues.get({ owner, repo, issue_number: issueNumber })).data;
            const labels = issue.labels.map((label) => label.name).filter((label) => !states.includes(label));
            const setState = (state) => github.rest.issues.setLabels({
              owner, repo, issue_number: issueNumber, labels: [...labels, state],
            });
            const [related] = result.decision.numbers ?? [];
            if (result.issue !== issueNumber || result.baseSha !== process.env.EXPECTED_BASE) {
              throw new Error("Task result does not match this trusted run.");
            }
            const relatedIssues = await Promise.all((result.decision.numbers ?? []).map(async (number) => {
              const relatedIssue = (await github.rest.issues.get({ owner, repo, issue_number: number })).data;
              if (relatedIssue.pull_request || relatedIssue.user.id !== 38769771) {
                throw new Error(`Related issue #${number} is not trusted pipeline work.`);
              }
              return relatedIssue;
            }));
            if (result.decision.type === "grouped" && related) {
              if (relatedIssues[0].state !== "open") throw new Error(`Canonical issue #${related} is not open.`);
              await setState("agent:grouped");
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: `<!-- agent-pipeline canonical-issue=${related} -->\nGrouped with canonical issue #${related}.`,
              });
              await github.rest.issues.createComment({
                owner, repo, issue_number: related,
                body: `Issue #${issueNumber} adds requirements to this acceptance boundary and will run as a follow-up after deployment.`,
              });
            } else if (result.decision.type === "blocked" && result.decision.numbers.length > 0) {
              await setState("agent:blocked");
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: `<!-- agent-pipeline blocked-by=${result.decision.numbers.join(",")} -->\nWaiting on ${result.decision.numbers.map((number) => `#${number}`).join(", ")}.`,
              });
            } else if (result.decision.type === "duplicate" && related) {
              await github.rest.issues.setLabels({ owner, repo, issue_number: issueNumber, labels });
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber, body: `Duplicate of #${related}.`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issueNumber, state: "closed", state_reason: "not_planned",
              });
            } else {
              await setState("agent:failed");
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: `<!-- agent-pipeline run-failed=${context.runId} -->\n${String(result.report).slice(0, 50000)}`,
              });
            }

      - name: Verify publication preconditions and apply patch
        if: needs.implement.result == 'success' && needs.implement.outputs.decision == 'ready' && needs.verify.result == 'success'
        env:
          EXPECTED_DIGEST: ${{ needs.implement.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_base="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${{ github.event.repository.default_branch }}" --jq '.commit.sha')"
          if [[ "$current_base" != "$EXPECTED_BASE" ]]; then
            printf 'Default branch advanced from %s to %s.\n' "$EXPECTED_BASE" "$current_base" >&2
            exit 1
          fi
          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const patch = fs.readFileSync("task-artifact/task.patch");
          const result = JSON.parse(fs.readFileSync("task-artifact/task-result.json", "utf8"));
          const digest = crypto.createHash("sha256").update(patch).digest("hex");
          if (result.issue !== Number(process.env.ISSUE_NUMBER)
              || result.baseSha !== process.env.EXPECTED_BASE
              || result.digest !== digest
              || digest !== process.env.EXPECTED_DIGEST
              || result.decision?.type !== "ready") {
            throw new Error("Task artifact failed publication identity checks.");
          }
          NODE
          git apply --index --check task-artifact/task.patch
          git apply --index task-artifact/task.patch
          test -n "$(git diff --cached --name-only)"

      - name: Exchange OIDC for OpenCode App token
        id: app-token
        if: needs.implement.result == 'success' && needs.implement.outputs.decision == 'ready' && needs.verify.result == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const oidcToken = await core.getIDToken("opencode-github-action");
            const response = await fetch("https://api.opencode.ai/exchange_github_app_token", {
              method: "POST",
              headers: { Authorization: `Bearer ${oidcToken}` },
            });
            if (!response.ok) {
              let detail = response.statusText;
              try { detail = (await response.json()).error ?? detail; } catch {}
              throw new Error(`OpenCode App token exchange failed: ${response.status} ${detail}`);
            }
            const { token } = await response.json();
            if (!token) throw new Error("OpenCode App token exchange returned no token.");
            core.setSecret(token);
            core.setOutput("token", token);

      - name: Publish App-authored branch and PR
        if: needs.implement.result == 'success' && needs.implement.outputs.decision == 'ready' && needs.verify.result == 'success'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="opencode/issue${ISSUE_NUMBER}-run${GITHUB_RUN_ID}"
          git config user.name "opencode-agent[bot]"
          git config user.email "opencode-agent[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "Implement issue #${ISSUE_NUMBER}"
          auth="$(printf 'x-access-token:%s' "$APP_TOKEN" | base64)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${branch}"
          title="$(gh issue view "$ISSUE_NUMBER" --json title --jq '.title')"
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$branch" \
            --title "$title" \
            --body "<!-- agent-pipeline task-run=${GITHUB_RUN_ID} issue=${ISSUE_NUMBER} base=${EXPECTED_BASE} -->

          Closes #${ISSUE_NUMBER}"

      - name: Mark issue under review
        if: needs.implement.result == 'success' && needs.implement.outputs.decision == 'ready' && needs.verify.result == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const states = [
              "agent:inbox", "agent:triage", "agent:ready", "agent:running",
              "agent:grouped", "agent:blocked", "agent:review", "agent:approved",
              "agent:deployed", "agent:failed",
            ];
            const issue = (await github.rest.issues.get({ owner, repo, issue_number: issueNumber })).data;
            const labels = issue.labels.map((label) => label.name).filter((label) => !states.includes(label));
            await github.rest.issues.setLabels({
              owner, repo, issue_number: issueNumber, labels: [...labels, "agent:review"],
            });

      - name: Mark failed implementation or publication
        if: failure() || needs.implement.result != 'success' || (needs.implement.outputs.decision == 'ready' && needs.verify.result != 'success')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const states = [
              "agent:inbox", "agent:triage", "agent:ready", "agent:running",
              "agent:grouped", "agent:blocked", "agent:review", "agent:approved",
              "agent:deployed", "agent:failed",
            ];
            const issue = (await github.rest.issues.get({ owner, repo, issue_number: issueNumber })).data;
            const labels = issue.labels.map((label) => label.name).filter((label) => !states.includes(label));
            await github.rest.issues.setLabels({
              owner, repo, issue_number: issueNumber, labels: [...labels, "agent:failed"],
            });
            await github.rest.issues.createComment({
              owner, repo, issue_number: issueNumber,
              body: `<!-- agent-pipeline run-failed=${context.runId} --> Agent Task failed: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            });
