name: Agent Reconcile

# GitHub's cron silently skips ticks for long stretches, so the schedule is
# only a backstop: every pipeline run that completes triggers a sweep directly,
# which is exactly when durable state needs repairing.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: [Agent Task, Agent Review, Release]
    types: [in_progress, completed]

permissions: {}

concurrency:
  group: quickducks-agent-reconcile
  cancel-in-progress: false

jobs:
  # A conflicting candidate cannot retain its exact-tree validation artifact.
  # Return its saved patch to the same implementation session so the model can
  # resolve the conflict against current main and produce a fresh attestation.
  refresh-candidates:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_run' || github.actor_id == '38769771'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
      issues: write
      pull-requests: write
    steps:
      - name: Return conflicting candidates for same-session repair
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,headRefName,author,body,mergeable \
            --jq '.[] | select(.author.login == "app/github-actions") | select(.headRefName | startswith("opencode/")) | select(.mergeable == "CONFLICTING") | @base64' \
            > candidates.txt || true

          while read -r encoded; do
            [[ -z "$encoded" ]] && continue
            candidate="$(printf '%s' "$encoded" | base64 --decode)"
            number="$(printf '%s' "$candidate" | node -e 'let b="";process.stdin.on("data",c=>b+=c).on("end",()=>console.log(JSON.parse(b).number))')"
            issue="$(printf '%s' "$candidate" | node -e 'let b="";process.stdin.on("data",c=>b+=c).on("end",()=>{const m=JSON.parse(b).body.match(/<!-- agent-pipeline task-run=\d+ issue=(\d+) /);console.log(m?m[1]:"")})')"
            if [[ -n "$issue" ]]; then
              gh pr close "$number" --delete-branch \
                --comment "Superseded: this candidate conflicts with current main. Returning its saved patch to the existing implementation session." > /dev/null 2>&1 || true
              gh workflow run agent-task.yml --ref "$DEFAULT_BRANCH" -f issue="$issue" > /dev/null 2>&1 || true
            fi
          done < candidates.txt

  reconcile:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_run' || github.actor_id == '38769771'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: write
      checks: read
      contents: read
      issues: write
      pull-requests: write
      statuses: read
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Reconcile durable pipeline state
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const module = await import(`${process.env.GITHUB_WORKSPACE}/scripts/agent-pipeline.mjs`);
            await module.reconcileAgentPipeline({ github, context, core });

  queue-next:
    needs: reconcile
    if: needs.reconcile.result == 'success'
    concurrency:
      group: quickducks-agent-merge-lane
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      statuses: read
      # Merges the admitted PR directly; executes only the trusted default branch.
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Admit oldest approved PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const module = await import(`${process.env.GITHUB_WORKSPACE}/scripts/agent-pipeline.mjs`);
            await module.queueNextApproved({ github, context, core });

  metrics:
    name: Metrics
    needs: [refresh-candidates, reconcile, queue-next]
    if: always()
    permissions:
      actions: read
    uses: ./.github/workflows/pipeline-metrics.yml
    with:
      pipeline: Agent Reconcile
