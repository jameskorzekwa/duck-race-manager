name: Pipeline Metrics

on:
  workflow_call:
    inputs:
      pipeline:
        required: true
        type: string

permissions: {}

jobs:
  collect:
    name: Collect timing metrics
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Download implementation metrics
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: agent-task-${{ github.run_id }}-*
          path: source-metrics/task

      - name: Download review metrics
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: agent-review-*
          path: source-metrics/review

      - name: Collect durations and model usage
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PIPELINE_NAME: ${{ inputs.pipeline }}
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const { owner, repo } = context.repo;
            const run = (await github.rest.actions.getWorkflowRun({ owner, repo, run_id: context.runId })).data;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: context.runId, filter: "latest", per_page: 100,
            });
            const now = Date.now();
            const milliseconds = (start, end) => start ? Math.max(0, Date.parse(end ?? new Date(now).toISOString()) - Date.parse(start)) : null;
            const records = jobs.filter((job) => job.name !== "Metrics / Collect timing metrics").map((job) => ({
              id: job.id,
              name: job.name,
              status: job.status,
              conclusion: job.conclusion,
              queuedMs: milliseconds(job.created_at, job.started_at),
              durationMs: milliseconds(job.started_at, job.completed_at),
              startedAt: job.started_at,
              completedAt: job.completed_at,
              steps: (job.steps ?? []).map((step) => ({
                name: step.name,
                conclusion: step.conclusion,
                durationMs: milliseconds(step.started_at, step.completed_at),
              })),
            }));
            const modelRuns = [];
            const visit = (directory) => {
              if (!fs.existsSync(directory)) return;
              for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
                const file = path.join(directory, entry.name);
                if (entry.isDirectory()) visit(file);
                else if (["task-result.json", "review-result.json"].includes(entry.name)) {
                  try {
                    const value = JSON.parse(fs.readFileSync(file, "utf8"));
                    if (value.modelMetrics) modelRuns.push(value.modelMetrics);
                  } catch {}
                }
              }
            };
            visit("source-metrics");
            const metrics = {
              schemaVersion: 1,
              pipeline: process.env.PIPELINE_NAME,
              repository: `${owner}/${repo}`,
              runId: context.runId,
              runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              event: run.event,
              status: run.status,
              conclusion: run.conclusion,
              createdAt: run.created_at,
              collectedAt: new Date(now).toISOString(),
              durationMs: milliseconds(run.created_at, new Date(now).toISOString()),
              jobs: records,
              modelRuns,
            };
            fs.mkdirSync("pipeline-metrics", { recursive: true });
            fs.writeFileSync("pipeline-metrics/metrics.json", `${JSON.stringify(metrics, null, 2)}\n`);
            await core.summary
              .addHeading(`${process.env.PIPELINE_NAME} metrics`)
              .addTable([
                [{ data: "Job", header: true }, { data: "Queue", header: true }, { data: "Run", header: true }, { data: "Result", header: true }],
                ...records.map((job) => [
                  job.name,
                  job.queuedMs === null ? "n/a" : `${(job.queuedMs / 1000).toFixed(1)}s`,
                  job.durationMs === null ? "n/a" : `${(job.durationMs / 1000).toFixed(1)}s`,
                  job.conclusion ?? job.status,
                ]),
              ])
              .addRaw(`\nModel sessions recorded: ${modelRuns.length}. Full metrics are in the run artifact.\n`)
              .write();

      - name: Upload durable pipeline metrics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pipeline-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: pipeline-metrics/metrics.json
          if-no-files-found: error
          retention-days: 90
