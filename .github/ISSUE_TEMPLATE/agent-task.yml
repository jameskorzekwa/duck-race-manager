name: Agent feature or fix
description: Submit a feature, fix, or documentation change to the OpenCode agent pipeline.
title: "[Agent] "
labels:
  - agent:inbox
body:
  - type: markdown
    attributes:
      value: |
        The automated agent pipeline only runs on issues opened by the
        repository owner. Anyone is welcome to file a report here and it will be
        read, but submissions from other accounts are never executed
        automatically and their pipeline labels are removed.
  - type: textarea
    id: problem
    attributes:
      label: Problem or feature
      description: Describe the observed problem or desired behavior and who it affects.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List externally observable conditions that must be true when the work is complete.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and context
      description: Include relevant workflows, prior issues, screenshots, compatibility requirements, or explicit non-goals.
    validations:
      required: false
